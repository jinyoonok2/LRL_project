name: rby1_pick_pnp_horizon450_inverted
description: Pick/PnP 10-episode test with 450-step horizon and inverted gripper mapping.

extends: rby1_eval.yaml

paths:
  output_base_dir: /u/xna8aw/workspace/live-robotics-lab/LRL_project/MolmoBot/MolmoBot/eval_output/experiments/rby1_pick_pnp_horizon450_inverted

tasks:
  - pick
  - pnp

indices:
  - 10
  - 21
  - 33
  - 56
  - 58
  - 74
  - 99
  - 101
  - 123
  - 137

eval:
  task_horizon_steps: 450
  terminate_upon_success: true

policy_env:
  RBY1_GRIPPER_OUTPUT_MODE: binary_rby1_inverted
  RBY1_GRIPPER_BINARY_THRESHOLD: "0.0"
  RBY1_GRIPPER_OPEN_POSITION: "-0.05"
  RBY1_GRIPPER_CLOSED_POSITION: "0.0"
